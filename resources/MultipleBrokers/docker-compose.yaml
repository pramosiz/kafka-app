networks:
  kafka-network:
    driver: bridge

volumes:
  zookeeper_cluster_data:
    driver: local
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local
  kafka3_data:
    driver: local

services:
  kafka1:
    image: apache/kafka:4.0.0
    container_name: kafka1
    hostname: kafka1
    ports:
        - "29092:9092"
    environment: # https://kafka.apache.org/documentation/#brokerconfigs_num.partitions
        
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9091
        KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
        KAFKA_LISTENERS: CONTROLLER://kafka1:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka1:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

        # Required for a single node cluster
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
        KAFKA_BROKER_ID: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 300
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

        # KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - kafka-network

  kafka2:
    image: apache/kafka:4.0.0
    container_name: kafka2
    hostname: kafka2
    ports:
        - "29093:9092"
    environment: # https://kafka.apache.org/documentation/#brokerconfigs_num.partitions
        
        KAFKA_NODE_ID: 2
        KAFKA_PROCESS_ROLES: broker,controller
        
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka2:9091
        KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
        KAFKA_LISTENERS: CONTROLLER://kafka2:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka2:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

        # Required for a single node cluster
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
        KAFKA_BROKER_ID: 2
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 300
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

        # KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qa
    networks:
      - kafka-network

  kafka3:
    image: apache/kafka:4.0.0
    container_name: kafka3
    hostname: kafka3
    ports:
        - "29094:9092"
    environment: # https://kafka.apache.org/documentation/#brokerconfigs_num.partitions

        KAFKA_NODE_ID: 3
        KAFKA_PROCESS_ROLES: broker,controller
        
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 3@kafka3:9091
        KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
        KAFKA_LISTENERS: CONTROLLER://kafka3:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka3:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

        # Required for a single node cluster
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
        KAFKA_BROKER_ID: 3
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 300
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

        # KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qq
    networks:
      - kafka-network

#   kafka-ui:
#       image: provectuslabs/kafka-ui
#       container_name: kafka-ui
#       ports:
#           - "8000:8080"
#       restart: always
#       depends_on:
#           - kafka
#       environment:
#           DYNAMIC_CONFIG_ENABLED: 'true'
#           KAFKA_CLUSTERS_0_NAME: local
#           KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

  akhq:
    container_name: akhq
    image: tchiotludo/akhq:0.25.1
    ports:
      - "8000:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka-cluster:
              properties:
                bootstrap.servers: "kafka1:9093,kafka2:9093,kafka3:9093"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network


